name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check the [ROADMAP.md](https://github.com/bshuler/critical-wormhole-tools/blob/main/ROADMAP.md) first to see if it's already planned.

  - type: checkboxes
    id: roadmap-check
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have checked the ROADMAP.md and this feature is not already planned
          required: true
        - label: I have searched existing issues to ensure this hasn't been requested before
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: It would be great if wh could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New command/tool
        - Enhancement to existing command
        - WNS (Wormhole Name Service)
        - Browser extension
        - Web server integration
        - Performance improvement
        - Security enhancement
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe a specific scenario where this feature would be useful.
      placeholder: As a system administrator, I need to...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in contributing this feature?
      options:
        - label: I would be willing to submit a PR for this feature
