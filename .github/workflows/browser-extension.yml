name: Browser Extension

on:
  push:
    branches: [main, develop]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/browser-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/browser-extension.yml'

defaults:
  run:
    working-directory: browser-extension

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build --if-present

  build-artifacts:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build --if-present

      - name: Create Chrome ZIP
        run: |
          cd dist 2>/dev/null || cd .
          zip -r ../wormhole-extension-chrome.zip . -x "*.map"

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: browser-extension/wormhole-extension-chrome.zip
          if-no-files-found: warn
