name: Discovery Site

on:
  push:
    branches: [main]
    paths:
      - 'discovery-site/**'
      - '.github/workflows/discovery-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'discovery-site/**'
      - '.github/workflows/discovery-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: discovery-site

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: discovery-site/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linting
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build site
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: discovery-site/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::256140316797:role/apps/developer-app-criticalwormholebrowser
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build site
        run: npm run build

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://criticalwormholebrowser-prod-discovery-256140316797/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1MY6E2NZPDEXV \
            --paths "/*"

      - name: Output site URL
        run: |
          echo "Site deployed to: https://discovery.prod.criticalwormholebrowser.apps.criticalwormhole.tools"
