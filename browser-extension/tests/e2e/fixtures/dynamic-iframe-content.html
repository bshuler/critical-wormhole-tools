<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Iframe</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 15px;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: white;
      margin: 0;
    }
    h3 { margin-top: 0; }
  </style>
</head>
<body>
  <h3>Dynamic Iframe Loaded!</h3>
  <p>This iframe was created dynamically via JavaScript and loaded through the wormhole.</p>
  <p><strong>Timestamp:</strong> <span id="timestamp"></span></p>

  <script>
    document.getElementById('timestamp').textContent = new Date().toLocaleString();
    console.log('[Dynamic Iframe] Loaded at', new Date().toISOString());
  </script>
</body>
</html>
