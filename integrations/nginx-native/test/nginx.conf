# Test configuration for Wormhole Nginx Module
#
# This configuration demonstrates how to use the wormhole module
# with nginx to handle wh:// and .wns requests.

worker_processes  1;
error_log  logs/error.log debug;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_wormhole_name"';

    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream for wormhole daemon
    upstream wormhole_daemon {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost *.wns *.wormhole;

        # Enable wormhole module
        wormhole_enable on;
        wormhole_daemon http://127.0.0.1:8080;
        wormhole_identity default;
        wormhole_timeout 30s;
        wormhole_connect_timeout 10s;

        # Main location - wormhole handler intercepts wh:// and .wns requests
        location / {
            # For non-wormhole requests, serve from docroot
            root   html;
            index  index.html index.htm;

            # Wormhole requests are intercepted by the module
            # and proxied to the daemon
        }

        # Internal location for wormhole proxy
        # The module redirects wh:// requests here
        location @wormhole_proxy {
            internal;
            proxy_pass http://wormhole_daemon;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # Direct access to daemon browse endpoint
        location /browse/ {
            proxy_pass http://wormhole_daemon;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }

        # Daemon API endpoints
        location /api/ {
            proxy_pass http://wormhole_daemon;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # HTTPS server (optional - requires SSL certificates)
    # server {
    #     listen       443 ssl;
    #     server_name  localhost *.wns *.wormhole;
    #
    #     ssl_certificate      cert.pem;
    #     ssl_certificate_key  cert.key;
    #
    #     wormhole_enable on;
    #     wormhole_daemon http://127.0.0.1:8080;
    #
    #     location / {
    #         root   html;
    #         index  index.html index.htm;
    #     }
    #
    #     location @wormhole_proxy {
    #         internal;
    #         proxy_pass http://wormhole_daemon;
    #     }
    # }
}
