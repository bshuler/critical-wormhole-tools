<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wormhole Sandbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: auto;
    }
    #sandbox-content {
      width: 100%;
      min-height: 100%;
    }
  </style>
</head>
<body>
  <div id="sandbox-content"></div>

  <script>
    /**
     * Sandbox Frame - Full-featured content renderer
     *
     * Features:
     * - Inline script execution
     * - External resource proxying (CSS, images, scripts)
     * - Fetch/XHR interception
     * - localStorage/sessionStorage proxy
     * - Cookie proxy
     * - window.location proxy
     */

    const contentEl = document.getElementById('sandbox-content');
    let currentPath = '/';
    let currentAddress = '';

    // Pending resource requests (waiting for parent response)
    const pendingRequests = new Map();
    let requestId = 0;

    // Per-site storage (proxied through parent)
    const siteStorage = {
      local: {},
      session: {}
    };

    // Per-site cookies
    let siteCookies = {};

    /**
     * Generate unique request ID
     */
    function getRequestId() {
      return `req-${++requestId}-${Date.now()}`;
    }

    /**
     * Request a resource from parent (via wormhole)
     */
    function requestResource(path, options = {}) {
      return new Promise((resolve, reject) => {
        const id = getRequestId();
        const timeout = setTimeout(() => {
          pendingRequests.delete(id);
          reject(new Error('Resource request timeout: ' + path));
        }, 30000);

        pendingRequests.set(id, { resolve, reject, timeout });

        window.parent.postMessage({
          type: 'RESOURCE_REQUEST',
          id: id,
          path: path,
          method: options.method || 'GET',
          headers: options.headers || {},
          body: options.body || null,
          responseType: options.responseType || 'text'
        }, '*');
      });
    }

    /**
     * Check if a URL is external
     */
    function isExternalUrl(url) {
      if (!url) return false;
      return url.startsWith('http://') ||
             url.startsWith('https://') ||
             url.startsWith('//') ||
             url.startsWith('data:') ||
             url.startsWith('blob:');
    }

    /**
     * Check if a link is external (should not be intercepted for navigation)
     */
    function isExternalLink(href) {
      if (!href) return true;
      return href.startsWith('http://') ||
             href.startsWith('https://') ||
             href.startsWith('javascript:') ||
             href.startsWith('mailto:') ||
             href.startsWith('tel:') ||
             href.startsWith('#') ||
             href.startsWith('//');
    }

    /**
     * Resolve a relative path against current path
     */
    function resolvePath(base, relative) {
      if (!relative) return base;
      if (relative.startsWith('/')) return relative;
      if (relative.startsWith('data:') || relative.startsWith('blob:')) return relative;

      const baseDir = base.endsWith('/') ? base : base.replace(/\/[^\/]*$/, '/');
      let path = baseDir + relative;

      // Normalize path (handle ../ and ./)
      const parts = path.split('/');
      const result = [];
      for (const part of parts) {
        if (part === '..') {
          result.pop();
        } else if (part !== '.' && part !== '') {
          result.push(part);
        }
      }

      return '/' + result.join('/');
    }

    /**
     * Rewrite a single link element to use data-wh-href
     */
    function rewriteLink(link) {
      const href = link.getAttribute('href');
      if (!href || link.hasAttribute('data-wh-href')) return false;

      if (!isExternalLink(href)) {
        link.setAttribute('data-wh-href', href);
        link.setAttribute('href', '#');
        link.classList.add('wh-internal-link');
        return true;
      }
      return false;
    }

    /**
     * Process and load external stylesheets
     */
    async function loadExternalStylesheets(doc) {
      const links = doc.querySelectorAll('link[rel="stylesheet"]');
      const promises = [];

      links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && !isExternalUrl(href)) {
          const resolvedPath = resolvePath(currentPath, href);
          console.log('[Sandbox] Loading stylesheet:', resolvedPath);

          const promise = requestResource(resolvedPath)
            .then(css => {
              // Create inline style element
              const style = document.createElement('style');
              style.textContent = css;
              style.setAttribute('data-original-href', href);
              link.parentNode.replaceChild(style, link);
              console.log('[Sandbox] Loaded stylesheet:', resolvedPath);
            })
            .catch(err => {
              console.error('[Sandbox] Failed to load stylesheet:', resolvedPath, err);
            });

          promises.push(promise);
        }
      });

      return Promise.all(promises);
    }

    /**
     * Process and load external scripts
     */
    async function loadExternalScripts(container) {
      const scripts = container.querySelectorAll('script[src]');

      for (const script of scripts) {
        const src = script.getAttribute('src');
        if (src && !isExternalUrl(src)) {
          const resolvedPath = resolvePath(currentPath, src);
          console.log('[Sandbox] Loading script:', resolvedPath);

          try {
            const code = await requestResource(resolvedPath);
            const newScript = document.createElement('script');
            newScript.textContent = code;
            newScript.setAttribute('data-original-src', src);
            if (script.type) newScript.type = script.type;
            script.parentNode.replaceChild(newScript, script);
            console.log('[Sandbox] Loaded script:', resolvedPath);
          } catch (err) {
            console.error('[Sandbox] Failed to load script:', resolvedPath, err);
          }
        }
      }
    }

    /**
     * Rewrite image sources to use blob URLs
     */
    async function rewriteImages(container) {
      const images = container.querySelectorAll('img[src]');
      const promises = [];

      images.forEach(img => {
        const src = img.getAttribute('src');
        if (src && !isExternalUrl(src)) {
          const resolvedPath = resolvePath(currentPath, src);
          console.log('[Sandbox] Loading image:', resolvedPath);

          // Store original for reference
          img.setAttribute('data-original-src', src);

          const promise = requestResource(resolvedPath, { responseType: 'blob' })
            .then(blobUrl => {
              img.src = blobUrl;
              console.log('[Sandbox] Loaded image:', resolvedPath);
            })
            .catch(err => {
              console.error('[Sandbox] Failed to load image:', resolvedPath, err);
            });

          promises.push(promise);
        }
      });

      return Promise.all(promises);
    }

    /**
     * Rewrite other media sources (video, audio, source)
     */
    async function rewriteMedia(container) {
      const mediaElements = container.querySelectorAll('video[src], audio[src], source[src]');
      const promises = [];

      mediaElements.forEach(el => {
        const src = el.getAttribute('src');
        if (src && !isExternalUrl(src)) {
          const resolvedPath = resolvePath(currentPath, src);
          el.setAttribute('data-original-src', src);

          const promise = requestResource(resolvedPath, { responseType: 'blob' })
            .then(blobUrl => {
              el.src = blobUrl;
              console.log('[Sandbox] Loaded media:', resolvedPath);
            })
            .catch(err => {
              console.error('[Sandbox] Failed to load media:', resolvedPath, err);
            });

          promises.push(promise);
        }
      });

      return Promise.all(promises);
    }

    /**
     * Rewrite CSS url() references in inline styles
     */
    async function rewriteCssUrls(container) {
      const styles = container.querySelectorAll('style');

      for (const style of styles) {
        let css = style.textContent;
        const urlMatches = css.match(/url\(['"]?([^'")]+)['"]?\)/g);

        if (urlMatches) {
          for (const match of urlMatches) {
            const urlMatch = match.match(/url\(['"]?([^'")]+)['"]?\)/);
            if (urlMatch && urlMatch[1] && !isExternalUrl(urlMatch[1])) {
              const originalUrl = urlMatch[1];
              const resolvedPath = resolvePath(currentPath, originalUrl);

              try {
                const blobUrl = await requestResource(resolvedPath, { responseType: 'blob' });
                css = css.replace(match, `url('${blobUrl}')`);
                console.log('[Sandbox] Rewrote CSS url:', originalUrl);
              } catch (err) {
                console.error('[Sandbox] Failed to load CSS resource:', resolvedPath, err);
              }
            }
          }
          style.textContent = css;
        }
      }
    }

    /**
     * Rewrite background-image in inline styles
     */
    async function rewriteInlineStyles(container) {
      const elements = container.querySelectorAll('[style*="url("]');

      for (const el of elements) {
        let style = el.getAttribute('style');
        const urlMatches = style.match(/url\(['"]?([^'")]+)['"]?\)/g);

        if (urlMatches) {
          for (const match of urlMatches) {
            const urlMatch = match.match(/url\(['"]?([^'")]+)['"]?\)/);
            if (urlMatch && urlMatch[1] && !isExternalUrl(urlMatch[1])) {
              const originalUrl = urlMatch[1];
              const resolvedPath = resolvePath(currentPath, originalUrl);

              try {
                const blobUrl = await requestResource(resolvedPath, { responseType: 'blob' });
                style = style.replace(match, `url('${blobUrl}')`);
              } catch (err) {
                console.error('[Sandbox] Failed to load inline style resource:', resolvedPath, err);
              }
            }
          }
          el.setAttribute('style', style);
        }
      }
    }

    /**
     * Override fetch() to route through wormhole
     */
    const originalFetch = window.fetch;
    window.fetch = async function(input, init = {}) {
      let url = typeof input === 'string' ? input : input.url;

      // External URLs use original fetch
      if (isExternalUrl(url)) {
        return originalFetch.call(window, input, init);
      }

      const resolvedPath = resolvePath(currentPath, url);
      console.log('[Sandbox] Intercepted fetch:', resolvedPath);

      try {
        const response = await requestResource(resolvedPath, {
          method: init.method || 'GET',
          headers: init.headers || {},
          body: init.body,
          responseType: 'full' // Get full response with headers
        });

        // Create a Response object
        return new Response(response.body, {
          status: response.status || 200,
          statusText: response.statusText || 'OK',
          headers: response.headers || {}
        });
      } catch (err) {
        throw new TypeError('Network request failed: ' + err.message);
      }
    };

    /**
     * Override XMLHttpRequest to route through wormhole
     */
    const OriginalXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = function() {
      const xhr = new OriginalXHR();
      const originalOpen = xhr.open;
      const originalSend = xhr.send;
      let method = 'GET';
      let url = '';
      let async = true;

      xhr.open = function(m, u, a = true) {
        method = m;
        url = u;
        async = a;

        if (isExternalUrl(u)) {
          return originalOpen.apply(xhr, arguments);
        }
        // For internal URLs, we'll handle in send()
      };

      xhr.send = function(body) {
        if (isExternalUrl(url)) {
          return originalSend.apply(xhr, arguments);
        }

        const resolvedPath = resolvePath(currentPath, url);
        console.log('[Sandbox] Intercepted XHR:', resolvedPath);

        requestResource(resolvedPath, {
          method: method,
          body: body,
          responseType: 'full'
        }).then(response => {
          // Simulate XHR response
          Object.defineProperty(xhr, 'status', { value: response.status || 200 });
          Object.defineProperty(xhr, 'statusText', { value: response.statusText || 'OK' });
          Object.defineProperty(xhr, 'responseText', { value: response.body });
          Object.defineProperty(xhr, 'response', { value: response.body });
          Object.defineProperty(xhr, 'readyState', { value: 4 });

          if (xhr.onreadystatechange) xhr.onreadystatechange();
          if (xhr.onload) xhr.onload();
        }).catch(err => {
          Object.defineProperty(xhr, 'status', { value: 0 });
          Object.defineProperty(xhr, 'readyState', { value: 4 });
          if (xhr.onerror) xhr.onerror(err);
        });
      };

      return xhr;
    };

    /**
     * WebSocket proxy - routes WebSocket connections through the wormhole
     */
    const pendingWebSockets = new Map();
    let wsIdCounter = 0;

    class WormholeWebSocket extends EventTarget {
      constructor(url, protocols) {
        super();

        this._id = `ws-${++wsIdCounter}-${Date.now()}`;
        this._url = url;
        this._protocols = protocols;
        this._readyState = WebSocket.CONNECTING;
        this._bufferedAmount = 0;
        this._extensions = '';
        this._protocol = '';
        this._binaryType = 'blob';

        // Event handlers
        this.onopen = null;
        this.onmessage = null;
        this.onerror = null;
        this.onclose = null;

        // Register this WebSocket
        pendingWebSockets.set(this._id, this);

        // Resolve URL
        let resolvedUrl = url;
        if (!isExternalUrl(url)) {
          // Convert relative WebSocket URL to wormhole path
          const wsPath = url.replace(/^ws:\/\/[^\/]+/, '').replace(/^wss:\/\/[^\/]+/, '') || '/';
          resolvedUrl = resolvePath(currentPath, wsPath);
        }

        console.log('[Sandbox] WebSocket connecting:', this._id, resolvedUrl);

        // Request WebSocket connection from parent
        window.parent.postMessage({
          type: 'WS_OPEN',
          id: this._id,
          url: resolvedUrl,
          protocols: protocols
        }, '*');
      }

      get url() { return this._url; }
      get readyState() { return this._readyState; }
      get bufferedAmount() { return this._bufferedAmount; }
      get extensions() { return this._extensions; }
      get protocol() { return this._protocol; }
      get binaryType() { return this._binaryType; }
      set binaryType(val) { this._binaryType = val; }

      send(data) {
        if (this._readyState !== WebSocket.OPEN) {
          throw new DOMException('WebSocket is not open', 'InvalidStateError');
        }

        window.parent.postMessage({
          type: 'WS_SEND',
          id: this._id,
          data: data
        }, '*');
      }

      close(code = 1000, reason = '') {
        if (this._readyState === WebSocket.CLOSING || this._readyState === WebSocket.CLOSED) {
          return;
        }

        this._readyState = WebSocket.CLOSING;

        window.parent.postMessage({
          type: 'WS_CLOSE',
          id: this._id,
          code: code,
          reason: reason
        }, '*');
      }

      // Internal methods called by message handler
      _handleOpen(protocol, extensions) {
        this._readyState = WebSocket.OPEN;
        this._protocol = protocol || '';
        this._extensions = extensions || '';

        const event = new Event('open');
        this.dispatchEvent(event);
        if (this.onopen) this.onopen(event);

        console.log('[Sandbox] WebSocket opened:', this._id);
      }

      _handleMessage(data) {
        const event = new MessageEvent('message', { data: data });
        this.dispatchEvent(event);
        if (this.onmessage) this.onmessage(event);
      }

      _handleError(message) {
        const event = new Event('error');
        this.dispatchEvent(event);
        if (this.onerror) this.onerror(event);

        console.error('[Sandbox] WebSocket error:', this._id, message);
      }

      _handleClose(code, reason, wasClean) {
        this._readyState = WebSocket.CLOSED;
        pendingWebSockets.delete(this._id);

        const event = new CloseEvent('close', {
          code: code || 1000,
          reason: reason || '',
          wasClean: wasClean !== false
        });
        this.dispatchEvent(event);
        if (this.onclose) this.onclose(event);

        console.log('[Sandbox] WebSocket closed:', this._id, code, reason);
      }

      // Static properties
      static get CONNECTING() { return 0; }
      static get OPEN() { return 1; }
      static get CLOSING() { return 2; }
      static get CLOSED() { return 3; }
    }

    // Replace WebSocket constructor
    window.WebSocket = WormholeWebSocket;

    /**
     * Handle WebSocket messages from parent
     */
    function handleWebSocketMessage(data) {
      const ws = pendingWebSockets.get(data.id);
      if (!ws) {
        console.warn('[Sandbox] WebSocket message for unknown ID:', data.id);
        return;
      }

      switch (data.event) {
        case 'open':
          ws._handleOpen(data.protocol, data.extensions);
          break;
        case 'message':
          ws._handleMessage(data.data);
          break;
        case 'error':
          ws._handleError(data.message);
          break;
        case 'close':
          ws._handleClose(data.code, data.reason, data.wasClean);
          break;
      }
    }

    /**
     * Iframe content loading - intercepts iframe src and loads through wormhole
     */
    async function loadIframeContent(iframe) {
      const src = iframe.getAttribute('src');
      if (!src || isExternalUrl(src) || iframe.hasAttribute('data-wh-loaded')) {
        return;
      }

      iframe.setAttribute('data-wh-loaded', 'true');
      const resolvedPath = resolvePath(currentPath, src);
      console.log('[Sandbox] Loading iframe content:', resolvedPath);

      try {
        const html = await requestResource(resolvedPath);

        // Create srcdoc with the fetched content
        // Add a base tag and inject our communication script
        const wrappedHtml = `
          <!DOCTYPE html>
          <html>
          <head>
            <base href="${resolvedPath}">
            <script>
              // Mini communication bridge for nested iframe
              window.addEventListener('message', function(e) {
                if (e.data.type === 'WH_PARENT_RESPONSE') {
                  window.dispatchEvent(new CustomEvent('wh-response', { detail: e.data }));
                }
              });

              // Override fetch for this iframe
              const originalFetch = window.fetch;
              window.fetch = async function(url, init) {
                if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:')) {
                  return originalFetch(url, init);
                }
                return new Promise((resolve, reject) => {
                  const id = 'iframe-req-' + Date.now() + '-' + Math.random();
                  const handler = (e) => {
                    if (e.detail.id === id) {
                      window.removeEventListener('wh-response', handler);
                      if (e.detail.error) reject(new Error(e.detail.error));
                      else resolve(new Response(e.detail.data, { status: e.detail.status || 200 }));
                    }
                  };
                  window.addEventListener('wh-response', handler);
                  window.parent.postMessage({ type: 'WH_IFRAME_REQUEST', id, url, method: init?.method || 'GET' }, '*');
                });
              };
            <\/script>
          </head>
          <body>
            ${html.replace(/<html[^>]*>|<\/html>|<head[^>]*>.*?<\/head>|<body[^>]*>|<\/body>/gis, '')}
          </body>
          </html>
        `;

        // Use srcdoc instead of src
        iframe.removeAttribute('src');
        iframe.setAttribute('srcdoc', wrappedHtml);

        console.log('[Sandbox] Iframe content loaded:', resolvedPath);
      } catch (error) {
        console.error('[Sandbox] Failed to load iframe:', resolvedPath, error);
        // Show error in iframe
        iframe.srcdoc = `<html><body style="font-family:sans-serif;padding:20px;color:#e74c3c;">
          <h3>Failed to load iframe</h3>
          <p>${error.message}</p>
        </body></html>`;
      }
    }

    /**
     * Process all iframes in a container
     */
    function processIframes(container) {
      const iframes = container.querySelectorAll('iframe[src]');
      iframes.forEach(iframe => loadIframeContent(iframe));
    }

    /**
     * Create localStorage proxy
     */
    const localStorageProxy = {
      getItem: (key) => siteStorage.local[key] ?? null,
      setItem: (key, value) => {
        siteStorage.local[key] = String(value);
        window.parent.postMessage({
          type: 'STORAGE_SET',
          storageType: 'local',
          key: key,
          value: String(value)
        }, '*');
      },
      removeItem: (key) => {
        delete siteStorage.local[key];
        window.parent.postMessage({
          type: 'STORAGE_REMOVE',
          storageType: 'local',
          key: key
        }, '*');
      },
      clear: () => {
        siteStorage.local = {};
        window.parent.postMessage({
          type: 'STORAGE_CLEAR',
          storageType: 'local'
        }, '*');
      },
      get length() { return Object.keys(siteStorage.local).length; },
      key: (index) => Object.keys(siteStorage.local)[index] ?? null
    };

    /**
     * Create sessionStorage proxy
     */
    const sessionStorageProxy = {
      getItem: (key) => siteStorage.session[key] ?? null,
      setItem: (key, value) => {
        siteStorage.session[key] = String(value);
        window.parent.postMessage({
          type: 'STORAGE_SET',
          storageType: 'session',
          key: key,
          value: String(value)
        }, '*');
      },
      removeItem: (key) => {
        delete siteStorage.session[key];
        window.parent.postMessage({
          type: 'STORAGE_REMOVE',
          storageType: 'session',
          key: key
        }, '*');
      },
      clear: () => {
        siteStorage.session = {};
        window.parent.postMessage({
          type: 'STORAGE_CLEAR',
          storageType: 'session'
        }, '*');
      },
      get length() { return Object.keys(siteStorage.session).length; },
      key: (index) => Object.keys(siteStorage.session)[index] ?? null
    };

    // Override localStorage and sessionStorage
    Object.defineProperty(window, 'localStorage', { value: localStorageProxy, writable: false });
    Object.defineProperty(window, 'sessionStorage', { value: sessionStorageProxy, writable: false });

    /**
     * Cookie proxy via document.cookie override
     */
    Object.defineProperty(document, 'cookie', {
      get: () => {
        return Object.entries(siteCookies)
          .map(([k, v]) => `${k}=${v}`)
          .join('; ');
      },
      set: (value) => {
        const parts = value.split(';')[0].split('=');
        if (parts.length >= 2) {
          const key = parts[0].trim();
          const val = parts.slice(1).join('=').trim();
          siteCookies[key] = val;
          window.parent.postMessage({
            type: 'COOKIE_SET',
            cookie: value
          }, '*');
        }
      }
    });

    /**
     * Location proxy - creates a full Location-like object
     */
    function createLocationProxy() {
      const getSearch = () => {
        const idx = currentPath.indexOf('?');
        const hashIdx = currentPath.indexOf('#');
        if (idx < 0) return '';
        const end = hashIdx > idx ? hashIdx : currentPath.length;
        return currentPath.substring(idx, end);
      };

      const getHash = () => {
        const idx = currentPath.indexOf('#');
        return idx >= 0 ? currentPath.substring(idx) : '';
      };

      const getPathname = () => {
        let path = currentPath;
        const queryIdx = path.indexOf('?');
        const hashIdx = path.indexOf('#');
        if (queryIdx >= 0) path = path.substring(0, queryIdx);
        else if (hashIdx >= 0) path = path.substring(0, hashIdx);
        return path || '/';
      };

      return {
        get href() { return `wh://${currentAddress}${currentPath}`; },
        set href(url) {
          if (url.startsWith('wh://')) {
            const parts = url.substring(5).split('/');
            const addr = parts[0];
            const path = '/' + parts.slice(1).join('/');
            window.parent.postMessage({ type: 'NAVIGATE_ADDRESS', address: addr, path: path }, '*');
          } else {
            window.parent.postMessage({ type: 'NAVIGATE', path: resolvePath(currentPath, url) }, '*');
          }
        },
        get pathname() { return getPathname(); },
        set pathname(val) {
          window.parent.postMessage({ type: 'NAVIGATE', path: val + getSearch() + getHash() }, '*');
        },
        get host() { return currentAddress; },
        get hostname() { return currentAddress; },
        get origin() { return `wh://${currentAddress}`; },
        get protocol() { return 'wh:'; },
        get search() { return getSearch(); },
        set search(val) {
          const s = val.startsWith('?') ? val : '?' + val;
          window.parent.postMessage({ type: 'NAVIGATE', path: getPathname() + s + getHash() }, '*');
        },
        get hash() { return getHash(); },
        set hash(val) {
          const h = val.startsWith('#') ? val : '#' + val;
          // Hash changes don't need navigation, just scroll
          const targetId = h.substring(1);
          const target = document.getElementById(targetId);
          if (target) target.scrollIntoView();
          // Update internal state
          const basePath = currentPath.split('#')[0];
          currentPath = basePath + h;
        },
        get port() { return ''; },

        assign: (url) => {
          window.parent.postMessage({ type: 'NAVIGATE', path: resolvePath(currentPath, url) }, '*');
        },
        replace: (url) => {
          window.parent.postMessage({ type: 'NAVIGATE', path: resolvePath(currentPath, url), replace: true }, '*');
        },
        reload: (forceGet) => {
          window.parent.postMessage({ type: 'NAVIGATE', path: currentPath, forceReload: !!forceGet }, '*');
        },
        toString() { return `wh://${currentAddress}${currentPath}`; },
        valueOf() { return `wh://${currentAddress}${currentPath}`; },
        // For compatibility
        ancestorOrigins: { length: 0 }
      };
    }

     */
    document.addEventListener('click', (event) => {
      const link = event.target.closest('a');
      if (!link) return;

      event.preventDefault();
      event.stopPropagation();

      // Check for internal wormhole link
      const whHref = link.getAttribute('data-wh-href');
      if (whHref) {
        const newPath = resolvePath(currentPath, whHref);
        console.log('[Sandbox] Internal link clicked:', whHref, '-> resolved to:', newPath);
        window.parent.postMessage({ type: 'NAVIGATE', path: newPath }, '*');
        return;
      }

      // External link
      const href = link.getAttribute('href');
      if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
        window.parent.postMessage({ type: 'EXTERNAL_LINK', url: href }, '*');
        return;
      }

      // Hash link
      if (href && href.startsWith('#')) {
        const targetId = href.substring(1);
        const target = document.getElementById(targetId);
        if (target) target.scrollIntoView();
        return;
      }

      // Non-rewritten internal link (fallback)
      if (href && !href.startsWith('javascript:') && !href.startsWith('mailto:') && !href.startsWith('tel:')) {
        const newPath = resolvePath(currentPath, href);
        window.parent.postMessage({ type: 'NAVIGATE', path: newPath }, '*');
      }
    }, true);

    /**
     * Handle form submissions with file upload support
     */
    document.addEventListener('submit', async (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;

      const action = form.getAttribute('action') || currentPath;
      const method = (form.getAttribute('method') || 'GET').toUpperCase();
      const enctype = form.getAttribute('enctype') || 'application/x-www-form-urlencoded';

      if (isExternalUrl(action)) return;

      event.preventDefault();
      event.stopPropagation();

      const formData = new FormData(form);
      const hasFiles = Array.from(formData.entries()).some(([k, v]) => v instanceof File && v.size > 0);

      const newPath = resolvePath(currentPath, action);

      if (hasFiles && enctype === 'multipart/form-data') {
        // Handle file uploads
        const filesData = [];
        const regularData = {};

        for (const [key, value] of formData.entries()) {
          if (value instanceof File && value.size > 0) {
            // Read file as base64
            const reader = new FileReader();
            const fileData = await new Promise((resolve) => {
              reader.onload = () => resolve({
                name: value.name,
                type: value.type,
                size: value.size,
                data: reader.result.split(',')[1] // base64 part
              });
              reader.readAsDataURL(value);
            });
            filesData.push({ field: key, file: fileData });
          } else {
            regularData[key] = value;
          }
        }

        window.parent.postMessage({
          type: 'FORM_SUBMIT',
          path: newPath,
          method: method,
          enctype: enctype,
          data: regularData,
          files: filesData
        }, '*');
      } else {
        // Regular form submission
        const data = {};
        for (const [key, value] of formData.entries()) {
          if (!(value instanceof File)) {
            data[key] = value;
          }
        }

        window.parent.postMessage({
          type: 'FORM_SUBMIT',
          path: newPath,
          method: method,
          data: data
        }, '*');
      }
    }, true);

    /**
     * Listen for messages from parent
     */
    window.addEventListener('message', (event) => {
      const { type, ...data } = event.data;

      switch (type) {
        case 'RENDER':
          renderContent(data.html, data.path, data.address, data.storage, data.cookies);
          break;

        case 'RESOURCE_RESPONSE':
          const pending = pendingRequests.get(data.id);
          if (pending) {
            clearTimeout(pending.timeout);
            pendingRequests.delete(data.id);
            if (data.error) {
              pending.reject(new Error(data.error));
            } else {
              pending.resolve(data.responseType === 'blob' ? data.blobUrl : data.data);
            }
          }
          break;

        case 'STORAGE_INIT':
          siteStorage.local = data.local || {};
          siteStorage.session = data.session || {};
          break;

        case 'COOKIES_INIT':
          siteCookies = data.cookies || {};
          break;

        case 'WS_EVENT':
          handleWebSocketMessage(data);
          break;

        case 'WH_IFRAME_REQUEST':
          // Handle requests from nested iframes
          requestResource(data.path, { method: data.method || 'GET', responseType: 'full' })
            .then(response => {
              // Find the iframe that sent this request and respond
              const iframes = document.querySelectorAll('iframe');
              iframes.forEach(iframe => {
                if (iframe.contentWindow) {
                  iframe.contentWindow.postMessage({
                    type: 'WH_PARENT_RESPONSE',
                    id: data.id,
                    data: response.body || response,
                    status: response.status || 200
                  }, '*');
                }
              });
            })
            .catch(error => {
              const iframes = document.querySelectorAll('iframe');
              iframes.forEach(iframe => {
                if (iframe.contentWindow) {
                  iframe.contentWindow.postMessage({
                    type: 'WH_PARENT_RESPONSE',
                    id: data.id,
                    error: error.message
                  }, '*');
                }
              });
            });
          break;
      }
    });

    // Signal that sandbox is ready
    window.parent.postMessage({ type: 'SANDBOX_READY' }, '*');
    console.log('[Sandbox] Ready with full resource support');
  </script>
</body>
</html>
