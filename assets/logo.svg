<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="wormholeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="url(#wormholeGrad)" />

  <!-- Inner rings creating depth effect -->
  <circle cx="100" cy="100" r="75" fill="url(#innerGrad)" />
  <circle cx="100" cy="100" r="60" fill="url(#wormholeGrad)" opacity="0.7" />
  <circle cx="100" cy="100" r="45" fill="url(#innerGrad)" />
  <circle cx="100" cy="100" r="30" fill="url(#wormholeGrad)" opacity="0.5" />
  <circle cx="100" cy="100" r="15" fill="url(#innerGrad)" />

  <!-- Center glow -->
  <circle cx="100" cy="100" r="8" fill="#c4b5fd" />
  <circle cx="100" cy="100" r="4" fill="#fff" />

  <!-- Connection arrows -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <!-- Left arrow -->
    <path d="M 25 100 L 45 100" />
    <path d="M 35 90 L 45 100 L 35 110" />

    <!-- Right arrow -->
    <path d="M 175 100 L 155 100" />
    <path d="M 165 90 L 155 100 L 165 110" />
  </g>
</svg>
